name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run optional public-network checks
        type: boolean
        default: false

permissions:
  contents: read

env:
  FASTMCP_MCP_CAMELCASE_COMPAT: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_project.py --mode offline
      - run: python scripts/verify_project.py --mode packaging --timeout 600
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-verification
          path: artifacts/verification/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_project.py --mode browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-verification
          path: artifacts/verification/

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_project.py --mode live
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-verification
          path: artifacts/verification/
