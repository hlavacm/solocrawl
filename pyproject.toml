[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solocrawl"
version = "1.0.0"
description = "Self-hosted async web search, scraping, and package-version lookup"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "Martin Hlaváč" }]
dependencies = [
    "ddgs>=9.0",
    "fastmcp>=3.4",
    "httpx>=0.28",
    "markdownify>=0.14",
    "packaging>=24.0",
    "python-dotenv>=1.2",
    "readability-lxml>=0.8",
    "semver>=3.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest-cov>=7.1",
]
all = [
    "solocrawl[browser]",
]

[project.scripts]
solocrawl = "solocrawl.cli.main:main"
solocrawl-mcp = "solocrawl.mcp.__main__:main"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["solocrawl"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that hit the real network (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"
